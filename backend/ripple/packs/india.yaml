# India region pack. Thresholds are starting values; ripple.eval tunes them on IBM AML.
# Sources for every legal number are in docs/domain.md.
id: india
name: India
currency: INR
rails: [UPI, IMPS, NEFT, RTGS, CASH]

detectors:
  pass_through: {forward_share: 0.8, within_minutes: 30, lookback_hours: 24, min_new_sender_share: 0.5,
                 min_inflow: 2000}
  fan_in_out: {min_senders: 5, window_hours: 24, min_outflow_share: 0.7}
  fan_out_burst: {min_new_payees: 5, window_minutes: 60}
  scatter_gather: {min_intermediaries: 3, window_hours: 48, min_pass_share: 0.5, max_gather_senders: 30,
                   max_origin_payees: 10}
  temporal_cycle: {max_hops: 5, window_hours: 72}
  cash_structuring:
    band_low: 45000              # just under the Rs 50,000 PAN-quote limit for cash deposits in a day
    band_high: 50000
    limit_label: PAN-quote limit
    min_deposits: 3
    window_days: 7
    ctr_monthly_limit: 1000000   # Rs 10 lakh, integrally connected cash in a month
  device_takeover: {window_minutes: 120}
  coerced_transfer: {min_amount: 100000, median_multiple: 5, drain_share: 0.7, lookback_hours: 72,
                     min_history_days: 14}

# Hours of data the engine sees before it may alert, so empty baselines and "every payee is new" at the
# start of a replay do not raise alerts. A live deployment would load this much history before going live.
warmup_hours: 24

fusion:
  # p = sigmoid(bias + sum(weight * layer score)). A strong detector hit alone (0.9) gives about 0.86;
  # a maximal baseline score alone gives about 0.62, which is Watch.
  weights: {bias: -4.0, detector: 6.5, baseline: 4.5, graph: 3.0, model: 5.0}
  baseline_only_cap: 0.69        # a lone baseline signal can reach Watch, never Review
  dismiss_days: 7                # a dismissed account pair cannot alert again for this long
graph:
  recompute_every: 500           # transactions between community and PageRank recomputes
  window_days: 7               # days of payments kept in the graph

tiers:
  alert: 0.60
  review: 0.70
  critical: 0.85
  ring_size_critical: 4          # with probability >= review
  case_window_hours: 24

report:
  type: STR
  authority: FIU-IND
  deadline_working_days: 7
