# Evaluation pack for IBM's "Transactions for Anti Money Laundering" dataset.
# Amounts are expected in one currency (USD) after conversion by the loader. Indian legal thresholds do not apply:
# cash structuring uses the US USD 10,000 currency transaction report line, and the Indian monthly CTR check is off.
# Detector, fusion and tier values match the India pack so evaluation results describe the same engine.
id: ibm_aml
name: IBM AML (evaluation)
currency: USD
rails: [ACH, WIRE, CHEQUE, CARD, CASH, CRYPTO, REINVESTMENT]

detectors:
  pass_through: {forward_share: 0.8, within_minutes: 30, lookback_hours: 24, min_new_sender_share: 0.5,
                 min_inflow: 0}
  fan_in_out: {min_senders: 5, window_hours: 24, min_outflow_share: 0.7}
  fan_out_burst: {min_new_payees: 5, window_minutes: 60}
  scatter_gather: {min_intermediaries: 3, window_hours: 48, min_pass_share: 0.5, max_gather_senders: 30,
                   max_origin_payees: 10}
  temporal_cycle: {max_hops: 5, window_hours: 72}
  cash_structuring:
    band_low: 9000
    band_high: 10000
    limit_label: currency transaction report line
    min_deposits: 3
    window_days: 7
    ctr_monthly_limit: null
  device_takeover: {window_minutes: 120}
  coerced_transfer: {min_amount: 1200, median_multiple: 5, drain_share: 0.7, lookback_hours: 72,
                     min_history_days: 7}

# Hours of data the engine sees before it may alert, so empty baselines and "every payee is new" at the
# start of a replay do not raise alerts. A live deployment would load this much history before going live.
warmup_hours: 48

fusion:
  weights: {bias: -4.0, detector: 6.5, baseline: 4.5, graph: 3.0, model: 5.0}
  baseline_only_cap: 0.69
  dismiss_days: 7
graph:
  recompute_every: 50000         # millions of rows: recompute communities less often
  window_days: 3               # days of payments kept in the graph

tiers:
  alert: 0.60
  review: 0.70
  critical: 0.85
  ring_size_critical: 4
  case_window_hours: 24
