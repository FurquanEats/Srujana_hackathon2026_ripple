[project]
name = "ripple-core"
version = "0.1.0"
description = "Ripple's shared core: money, Indian payment identifiers, signed messages, the simulated clock and SOP-consistent tracing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple_core"]
