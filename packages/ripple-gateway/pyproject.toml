[project]
name = "ripple-gateway"
version = "0.1.0"
description = "The web gateway: plain JSON on localhost for the web app's server, signed envelopes over mutual TLS to the network"
requires-python = ">=3.12,<3.13"
dependencies = ["ripple-core", "ripple-service", "ripple-cli"]

[tool.uv.sources]
ripple-core = { workspace = true }
ripple-service = { workspace = true }
ripple-cli = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple_gateway"]
