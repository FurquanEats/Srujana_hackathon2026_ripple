[project]
name = "ripple-cli"
version = "0.1.0"
description = "The `ripple` command: create the local network's keys and certificates, and start every service"
requires-python = ">=3.12,<3.13"
dependencies = ["ripple-core", "ripple-service", "ripple-node", "ripple-hubs"]

[project.scripts]
ripple = "ripple_cli.main:main"

[tool.uv.sources]
ripple-core = { workspace = true }
ripple-service = { workspace = true }
ripple-node = { workspace = true }
ripple-hubs = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple_cli"]
