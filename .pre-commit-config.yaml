# Install once with `uv run --with pre-commit pre-commit install`. CI runs the same checks plus Gitleaks and Semgrep.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^packages/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^packages/
      - id: mypy
        name: mypy
        entry: uv run mypy packages/ripple-core
        language: system
        pass_filenames: false
        files: ^packages/
